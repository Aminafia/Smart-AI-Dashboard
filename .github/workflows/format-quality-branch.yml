name: Format and Verify Quality Branch

on:
  push:
    branches:
      - quality/**
    paths:
      - "backend/**"
      - "frontend/src/**"
      - ".editorconfig"
      - ".github/workflows/format-quality-branch.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    name: Format source and verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend solution
        run: dotnet restore backend/BackendSmartAIDashboard.sln

      - name: Format backend C# source
        run: dotnet format backend/BackendSmartAIDashboard.sln --no-restore --verbosity quiet --exclude backend/Infrastructure/Migrations

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format frontend TypeScript and Angular templates
        working-directory: frontend
        run: npx --yes --package=prettier@3.6.2 --package=prettier-plugin-organize-imports@4.3.0 prettier --plugin prettier-plugin-organize-imports --write "src/**/*.ts" "src/**/*.html"

      - name: Commit formatting changes to the quality branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add backend frontend/src
            git commit -m "style: standardize backend and frontend source formatting"
            git push origin "${GITHUB_REF_NAME}"
          fi

      - name: Run backend unit tests
        run: dotnet test backend/BackendSmartAIDashboard.sln --configuration Release --no-restore

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --watch=false
